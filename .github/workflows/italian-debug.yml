name: APK italiano 1.4.3

on:
  push:
    branches: [ 'codex/italiano-1.4.3' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilazione e verifica APK italiano
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica sorgente
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
      - name: Installa SDK Android 16
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compila APK debug firmato e verifica lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Verifica firma e dati APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenCallShield-1.4.3-italiano-debug.apk
          APK=dist/OpenCallShield-1.4.3-italiano-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/firma.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee dist/apk-info.txt
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          meta = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert meta['applicationId'] == 'com.matteofronzi.opencallshield.it.debug', meta
          assert meta['elements'][0]['versionName'] == '1.4.3-it-debug', meta
          assert meta['elements'][0]['versionCode'] == 10403, meta
          info = Path('dist/apk-info.txt').read_text()
          assert "targetSdkVersion:'36'" in info, info
          assert "sdkVersion:'29'" in info, info
          assert "application-label:'OpenCallShield IT'" in info, info
          with zipfile.ZipFile('dist/OpenCallShield-1.4.3-italiano-debug.apk') as apk:
              assert not any(name.endswith('.so') for name in apk.namelist()), 'Verificare allineamento librerie native a 16 KB'
          PY
          (cd dist && sha256sum OpenCallShield-1.4.3-italiano-debug.apk > SHA256SUMS.txt)
          cp app/build/outputs/apk/debug/output-metadata.json dist/
          printf 'Commit: %s\nBuild: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > dist/compilazione.txt
      - name: Pubblica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: OpenCallShield-1.4.3-italiano-debug
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica rapporto lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-lint-italiano
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
