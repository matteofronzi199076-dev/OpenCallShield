name: APK italiano 1.4.3 con blocco estero automatico

on:
  push:
    branches: [ 'codex/italiano-estero-automatico' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilazione e verifica APK italiano
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica sorgente
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Installa SDK Android 16
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verifica regole, compila APK firmato e controlla lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Verifica firma e dati APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenCallShield-1.4.3-italiano-estero-debug.apk
          APK=dist/OpenCallShield-1.4.3-italiano-estero-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/firma.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee dist/apk-info.txt
          python3 - <<'PY'
          import json, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert sum(int(s.get('tests', 0)) for s in suites) == 10, 'Attesi 10 test delle regole'
          assert all(int(s.get('failures', 0)) == 0 and int(s.get('errors', 0)) == 0 and int(s.get('skipped', 0)) == 0 for s in suites)
          print('10 test delle regole superati')
          meta = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert meta['applicationId'] == 'com.matteofronzi.opencallshield.it.esteri.debug', meta
          assert meta['elements'][0]['versionName'] == '1.4.3-it-esteri-debug', meta
          assert meta['elements'][0]['versionCode'] == 10403, meta
          info = Path('dist/apk-info.txt').read_text()
          assert "targetSdkVersion:'36'" in info, info
          assert "sdkVersion:'29'" in info, info
          assert "application-label:'OpenCallShield IT Estero'" in info, info
          with zipfile.ZipFile('dist/OpenCallShield-1.4.3-italiano-estero-debug.apk') as apk:
              assert not any(name.endswith('.so') for name in apk.namelist()), 'Verificare allineamento librerie native a 16 KB'
          PY
          (cd dist && sha256sum OpenCallShield-1.4.3-italiano-estero-debug.apk > SHA256SUMS.txt)
          cp app/build/outputs/apk/debug/output-metadata.json dist/
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml dist/
          printf 'Commit: %s\nBuild: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > dist/compilazione.txt
      - name: Pubblica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: OpenCallShield-1.4.3-italiano-estero-debug
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica rapporti test e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporti-verifica-italiano-estero
          path: |
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
